[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockbox"
version = "0.1.0"
description = "Encrypted command-line password vault: Argon2id + AES-256-GCM with envelope encryption"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alawi Masfar" }]
keywords = ["password-manager", "cryptography", "argon2", "aes-gcm", "security"]
dependencies = ["cryptography>=42", "argon2-cffi>=23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lockbox = "lockbox.cli:main"

[tool.setuptools]
packages = ["lockbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
