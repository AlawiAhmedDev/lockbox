name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Smoke test
        run: |
          export LOCKBOX_VAULT=$RUNNER_TEMP/v.json
          printf 'ci master passphrase\n' | lockbox --password-stdin init
          printf 'ci master passphrase\n' | lockbox --password-stdin add demo --generate
          printf 'ci master passphrase\n' | lockbox --password-stdin list
          lockbox info
